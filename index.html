<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyssal Salvage - Deep, Blue Sea</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
    body {
      background-color: #030811; color: #e0f8ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #game-container {
      position: relative; width: 960px; height: 600px;
      border: 4px solid #1a3b5c; box-shadow: 0 0 30px rgba(0, 180, 255, 0.25);
      background: #020c1b; cursor: crosshair; overflow: hidden;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; position: absolute; top: 0; left: 0; }
    
    /* DOM-based HUD layer (Highly optimized by browser compositor) */
    #dom-hud {
      position: absolute; top: 10px; left: 10px; width: 340px; height: 80px;
      background: rgba(5, 15, 30, 0.85); border-radius: 4px; border: 1px solid #1a4971;
      z-index: 5; display: flex; flex-direction: column; padding: 10px; pointer-events: none;
    }
    .hud-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; font-weight: bold; }
    .hud-label { width: 60px; color: #e0f8ff; }
    .hud-bar-bg { width: 120px; height: 12px; background: rgba(255,255,255,0.1); margin-left: 10px; border-radius: 2px; overflow: hidden; position: relative; }
    .hud-bar-fill { height: 100%; width: 100%; transition: width 0.1s linear, background-color 0.2s; }
    #hud-o2-fill { background: #00e5ff; }
    #hud-hp-fill { background: #76ff03; }
    .hud-stats { color: #ffd700; font-size: 12px; font-weight: bold; margin-top: 4px; }
    
    #hud-depth { position: absolute; top: 10px; right: 20px; color: #00e5ff; font-size: 16px; font-weight: bold; z-index: 5; pointer-events: none; text-shadow: 1px 1px 2px #000; }
    #hud-extract-msg { position: absolute; top: 80px; width: 100%; text-align: center; font-size: 18px; font-weight: bold; z-index: 5; pointer-events: none; display: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

    .ui-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 10, 25, 0.92); backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; padding: 30px; transition: opacity 0.3s ease;
    }
    .hidden { display: none !important; opacity: 0; pointer-events: none; }
    h1 { font-size: 28px; color: #38ef7d; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(56, 239, 125, 0.5); }
    h2 { font-size: 18px; color: #00d2ff; margin-bottom: 20px; }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 800px; margin-top: 15px; }
    button {
      background: #0d223a; border: 2px solid #00d2ff; color: #e0f8ff;
      padding: 10px 18px; font-family: inherit; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; border-radius: 4px; text-transform: uppercase;
    }
    button:hover:not(:disabled) { background: #00d2ff; color: #030811; box-shadow: 0 0 15px rgba(0, 210, 255, 0.6); transform: translateY(-2px); }
    button:disabled { border-color: #455a64; color: #546e7a; cursor: not-allowed; background: #07121e; }
    
    .cert-card {
      border: 4px double #ffd700; padding: 24px; text-align: center; border-radius: 8px;
      background: #051424; max-width: 550px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    }
    .cert-card h3 { color: #ffd700; font-size: 22px; margin-bottom: 12px; }
    .cert-stats { margin: 15px 0; font-size: 14px; line-height: 1.6; color: #b0bec5; text-align: left; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 4px; }
    
    .shop-wrapper {
      width: 100%; max-width: 740px; max-height: 380px; overflow-y: auto;
      margin-bottom: 20px; padding-right: 10px;
    }
    .shop-wrapper::-webkit-scrollbar { width: 8px; }
    .shop-wrapper::-webkit-scrollbar-track { background: rgba(7, 26, 46, 0.5); border-radius: 4px; }
    .shop-wrapper::-webkit-scrollbar-thumb { background: #1a4971; border-radius: 4px; border: 1px solid #00d2ff; }
    
    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; width: 100%; }
    .shop-item { background: linear-gradient(180deg, #071a2e 0%, #040e1a 100%); border: 1px solid #1a4971; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 6px; transition: border-color 0.2s; }
    .shop-item:hover { border-color: #00d2ff; }

    /* Custom Message Box (Replaces alert/confirm) */
    #messageBoxOverlay { z-index: 100; background: rgba(0,0,0,0.85); }
    .msg-box { background: #0a192f; border: 2px solid #00d2ff; padding: 25px; border-radius: 6px; text-align: center; max-width: 400px; box-shadow: 0 0 30px rgba(0, 210, 255, 0.3); }
    .msg-box h3 { color: #00d2ff; margin-bottom: 15px; font-size: 20px; }
    .msg-box p { color: #e0f8ff; margin-bottom: 25px; font-size: 14px; line-height: 1.5; }
  </style>
</head>

      <div class="cert-stats" id="certStats"></div>
      <button id="claimCertBtn">Log & Return to Base</button>

  </div>

  <!-- Custom Alert/Confirm Modal -->

class AudioManager {
  static SFX = {};
  static MUSIC = {};
  static currentBGM = null;
  static shootCounter = 0;
  static chokeTimer = 0;

  static init() {
    const sfxFiles = ['heal_1', 'chest_open', 'pickup-coin', 'pickup-relic', 'menu-select', 'update-success', 'sprite-hurt', 'diver-hurt', 'long-explosion', 'short-explosion', 'shoot', 'level_up', 'dive-failure', 'menu-error', 'armed-charge'];
    sfxFiles.forEach(file => {
      let aud = new Audio(`assets/audio/${file}.wav`);
      aud.volume = 0.6;
      this.SFX[file] = aud;
    });

    const musicFiles = ['Tide_at_Twilight', 'Coconut_Coast_Jump', 'Steps_Above_The_Sea', 'Tides_of_the_Red_Isle', 'Tidal_Blade_Duel', 'Cannonade_at_High_Tide'];
    musicFiles.forEach(file => {
      let aud = new Audio(`assets/audio/${file}.webm`);
      aud.loop = true;
      aud.volume = 0.4;
      this.MUSIC[file] = aud;
    });
  }

  static playSFX(key, force = false) {
    if (!this.SFX[key]) return;
    
    if (key === 'shoot' && !force) {
      this.shootCounter++;
      if (this.shootCounter % 3 !== 0) return;
    }

    let sound = this.SFX[key].cloneNode();
    sound.volume = this.SFX[key].volume;
    sound.play().catch(e => console.warn("Audio blocked:", e));
  }

  static playMusic(key) {
    if (this.currentBGM && this.currentBGM.src.includes(key)) {
      this.currentBGM.volume = 0.4; 
      return;
    }
    if (this.currentBGM) {
      this.currentBGM.pause();
      this.currentBGM.currentTime = 0;
    }
    if (this.MUSIC[key]) {
      this.currentBGM = this.MUSIC[key];
      this.currentBGM.volume = 0.4;
      this.currentBGM.play().catch(e => console.warn("BGM blocked:", e));
    }
  }

  static setMusicVolume(vol) {
    if (this.currentBGM) this.currentBGM.volume = vol;
  }
}

class UIManager {
  static showModal(title, text, isConfirm = false) {
    return new Promise(resolve => {
      document.getElementById('msgTitle').innerText = title;
      document.getElementById('msgText').innerHTML = text;
      document.getElementById('messageBoxOverlay').classList.remove('hidden');
      
      const confirmBtn = document.getElementById('msgConfirmBtn');
      const cancelBtn = document.getElementById('msgCancelBtn');
      
      cancelBtn.classList.toggle('hidden', !isConfirm);

      const cleanup = () => {
        document.getElementById('messageBoxOverlay').classList.add('hidden');
        confirmBtn.onclick = null; cancelBtn.onclick = null;
      };

      confirmBtn.onclick = () => { cleanup(); resolve(true); };
      cancelBtn.onclick = () => { cleanup(); resolve(false); };
    });
  }
}

class SaveManager {
  // Use a getter to ensure a deep copy of the default state arrays is returned every time
  static get DEFAULT_STATE() {
    return { 
      gold: 0, 
      relicsFound: {}, 
      spentRelics: 0, 
      completedRegions: [], 
      purchasedUpgrades: ['suit_default'], 
      activeSuit: 'suit_default' 
    };
  }

  static load() {
    let state = this.DEFAULT_STATE;
    try {
      const data = localStorage.getItem('abyssal_save_v18_refactored');
      if (data) {
        const parsed = JSON.parse(data);
        // Schema Validation / Merge
        state = { ...this.DEFAULT_STATE, ...parsed };
        state.purchasedUpgrades = Array.isArray(parsed.purchasedUpgrades) ? parsed.purchasedUpgrades : ['suit_default'];
        
        // Migration to safely convert previous degaussed suit to gear upgrade
        let degaussIndex = state.purchasedUpgrades.indexOf('suit_degaussed');
        if (degaussIndex > -1) state.purchasedUpgrades[degaussIndex] = 'upgrade_degaussed';
        if (state.activeSuit === 'suit_degaussed') state.activeSuit = 'suit_default';
        
        if (!state.purchasedUpgrades.includes('suit_default')) state.purchasedUpgrades.push('suit_default');
      } else {
        // Migration from old unrefactored version if it exists
        const oldData = localStorage.getItem('abyssal_save_v18');
        if(oldData) {
          const parsedOld = JSON.parse(oldData);
          state = { ...this.DEFAULT_STATE, ...parsedOld };
          this.save(state);
        }
      }
    } catch(e) { console.error("Corrupted save file. Resetting to defaults.", e); }
    
    // ALWAYS initialize region relic arrays (fixes crash on fresh saves)
    REGIONS.forEach(r => { if (!state.relicsFound[r.id]) state.relicsFound[r.id] = []; });
    
    return state;
  }
  static save(state) { localStorage.setItem('abyssal_save_v18_refactored', JSON.stringify(state)); }
}

class AssetManager {
  static ASSETS = {};
  
  static init() {
    const promises = Object.keys(ASSET_MAP).map(key => {
      return new Promise(resolve => {
        const img = new Image();
        img.src = `assets/${ASSET_MAP[key]}.png`;
        img.onload = () => { this.ASSETS[key] = img; resolve(); };
        img.onerror = () => { 
          // Silently fail but resolve so game still starts, fallback geometry will draw
          this.ASSETS[key] = null; 
          resolve(); 
        };
      });
    });
    return Promise.all(promises);
  }

  static draw(ctx, key, x, y, w, h, fallbackFn) {
    const img = this.ASSETS[key];
    if (img && img.complete && img.naturalWidth !== 0) {
      if (fallbackFn && key !== 'wreck' && !key.includes('rock') && !key.includes('coral')) {
        ctx.drawImage(img, x - w/2, y - h/2, w, h); // Centered rendering
      } else {
        ctx.drawImage(img, x, y, w, h); // Top-left rendering
      }
    } else if (fallbackFn) {
      fallbackFn(ctx, x, y, w, h);
    }
  }
}

class InputManager {
  static keys = {};
  static mouse = { x: 0, y: 0, worldX: 0, worldY: 0, clickDown: false };
  
  static init(canvas) {
    window.addEventListener('keydown', e => this.keys[e.key] = true);
    window.addEventListener('keyup', e => this.keys[e.key] = false);
    // Crucial fix: clear keys on blur so they don't "stick" when tabbing out
    window.addEventListener('blur', () => this.keys = {}); 
    
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect(); 
      this.mouse.x = e.clientX - r.left; 
      this.mouse.y = e.clientY - r.top;
    });
    canvas.addEventListener('mousedown', e => { if (e.button === 0) this.mouse.clickDown = true; });
    canvas.addEventListener('mouseup', e => { if (e.button === 0) this.mouse.clickDown = false; });
  }

  static isMoving() {
    return this.keys['w'] || this.keys['ArrowUp'] || this.keys['s'] || this.keys['ArrowDown'] || 
           this.keys['a'] || this.keys['ArrowLeft'] || this.keys['d'] || this.keys['ArrowRight'];
  }
  static consumeKey(key) { if(this.keys[key]) { this.keys[key] = false; return true; } return false; }
  static consumeClick() { if(this.mouse.clickDown) { this.mouse.clickDown = false; return true; } return false; }
}

class ObjectPool {
  constructor(factoryFn, initialSize) {
    this.factoryFn = factoryFn;
    this.pool = Array.from({length: initialSize}, () => factoryFn());
  }
  get() {
    let obj = this.pool.find(o => !o.active);
    if (!obj) {
      obj = this.factoryFn();
      this.pool.push(obj);
    }
    obj.active = true;
    return obj;
  }
  getActive() { return this.pool.filter(o => o.active); }
  releaseAll() { this.pool.forEach(o => o.active = false); }
}

class SpatialHash {
  constructor(cellSize) {
    this.cellSize = cellSize;
    this.cells = new Map();
  }
  clear() { this.cells.clear(); }
  _hash(x, y) { return `${Math.floor(x / this.cellSize)},${Math.floor(y / this.cellSize)}`; }
  
  insert(entity) {
    const key = this._hash(entity.x, entity.y);
    if (!this.cells.has(key)) this.cells.set(key, []);
    this.cells.get(key).push(entity);
  }
  
  getNearby(x, y, radius) {
    const minC = Math.floor((x - radius) / this.cellSize);
    const maxC = Math.floor((x + radius) / this.cellSize);
    const minR = Math.floor((y - radius) / this.cellSize);
    const maxR = Math.floor((y + radius) / this.cellSize);
    
    let result = [];
    for (let c = minC; c <= maxC; c++) {
      for (let r = minR; r <= maxR; r++) {
        const key = `${c},${r}`;
        if (this.cells.has(key)) result.push(...this.cells.get(key));
      }
    }
    return result;
  }
}

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false }); // Optimize main canvas
    
    this.lightCanvas = document.createElement('canvas');
    this.lightCanvas.width = CONSTANTS.VIEW_W;
    this.lightCanvas.height = CONSTANTS.VIEW_H;
    this.lightCtx = this.lightCanvas.getContext('2d');
    
    // Set smoothing properties once
    this.ctx.imageSmoothingEnabled = false;
    this.lightCtx.imageSmoothingEnabled = false;
    
    this.offscreenCanvas = document.createElement('canvas');
    this.offscreenCtx = this.offscreenCanvas.getContext('2d', { alpha: false });
    this.offscreenCtx.imageSmoothingEnabled = false;
    
    // Pre-rendered light brushes (Huge performance boost over per-frame gradients)
    this.ambientBrush = this._createLightBrush(160, 'radial');
    this.beamBrush = this._createLightBrush(550, 'beam');
    this.anglerBrush = this._createLightBrush(150, 'angler');

    this.hud = {
      container: document.getElementById('dom-hud'),
      o2Fill: document.getElementById('hud-o2-fill'),
      hpFill: document.getElementById('hud-hp-fill'),
      stats: document.getElementById('hud-relics-mines'),
      depth: document.getElementById('hud-depth'),
      extractMsg: document.getElementById('hud-extract-msg'),
      lastHp: -1, lastO2: -1, lastRelics: -1, lastMines: -1, lastDepth: -1, lastExtract: null
    };
  }

  _createLightBrush(radius, type) {
    const c = document.createElement('canvas');
    c.width = radius * 2; c.height = radius * 2;
    const ctx = c.getContext('2d');
    
    if (type === 'radial') {
      let grad = ctx.createRadialGradient(radius, radius, 0, radius, radius, radius);
      grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(radius, radius, radius, 0, Math.PI*2); ctx.fill();
    } else if (type === 'beam') {
      let grad = ctx.createRadialGradient(radius, radius, 20, radius, radius, radius);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(radius, radius);
      ctx.arc(radius, radius, radius, -0.6, 0.6); ctx.lineTo(radius, radius); ctx.fill();
    } else if (type === 'angler') {
      let grad = ctx.createRadialGradient(radius, radius, 5, radius, radius, radius);
      grad.addColorStop(0, 'rgba(200, 255, 50, 0.9)'); grad.addColorStop(1, 'rgba(200, 255, 50, 0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(radius, radius, radius, 0, Math.PI*2); ctx.fill();
    }
    return c;
  }

  preRenderEnvironment(region, mapGrid) {
    const w = region.cols * CONSTANTS.TILE_SIZE;
    const h = region.rows * CONSTANTS.TILE_SIZE;
    this.offscreenCanvas.width = w;
    this.offscreenCanvas.height = h;
    
    // Draw Background Gradient
    let grad = this.offscreenCtx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, region.colorTop); grad.addColorStop(1, region.colorBot);
    this.offscreenCtx.fillStyle = grad; 
    this.offscreenCtx.fillRect(0, 0, w, h);

    // Draw Static Tiles
    for (let r = 0; r < region.rows; r++) {
      for (let c = 0; c < region.cols; c++) {
        let tile = mapGrid[r][c], tx = c * CONSTANTS.TILE_SIZE, ty = r * CONSTANTS.TILE_SIZE;
        if (tile >= 11 && tile <= 14) {
          this.offscreenCtx.fillStyle = region.rockColor; 
          this.offscreenCtx.fillRect(tx, ty, CONSTANTS.TILE_SIZE, CONSTANTS.TILE_SIZE);
          AssetManager.draw(this.offscreenCtx, `rock_${tile - 10}`, tx, ty, CONSTANTS.TILE_SIZE, CONSTANTS.TILE_SIZE);
        }
        else if (tile >= 21 && tile <= 24) {
          this.offscreenCtx.fillStyle = region.coralColor; 
          this.offscreenCtx.fillRect(tx, ty, CONSTANTS.TILE_SIZE, CONSTANTS.TILE_SIZE);
          AssetManager.draw(this.offscreenCtx, `coral_${tile - 20}`, tx, ty, CONSTANTS.TILE_SIZE, CONSTANTS.TILE_SIZE);
        }
        else if (tile === 31) {
          AssetManager.draw(this.offscreenCtx, 'wreck', tx, ty, CONSTANTS.TILE_SIZE, CONSTANTS.TILE_SIZE, (ct,x,y,w,h) => {
            ct.fillStyle = '#4e342e'; ct.fillRect(x, y, w, h);
            ct.strokeStyle = '#3e2723'; ct.strokeRect(x, y, w, h);
            ct.beginPath(); ct.moveTo(x, y + 10); ct.lineTo(x + w, y + 10);
            ct.moveTo(x, y + 30); ct.lineTo(x + w, y + 30); ct.stroke();
          });
        }
      }
    }
  }

  // Dirty updates to DOM avoiding layout thrashing
  updateDOMHUD(diver, regionState, depthMeters, extractMsg) {
    if (this.hud.lastO2 !== diver.o2) {
      this.hud.o2Fill.style.width = `${Math.max(0, (diver.o2 / diver.maxO2) * 100)}%`;
      this.hud.o2Fill.style.backgroundColor = diver.o2 < 25 ? '#ff1744' : '#00e5ff';
      this.hud.lastO2 = diver.o2;
    }
    if (this.hud.lastHp !== diver.hp) {
      this.hud.hpFill.style.width = `${Math.max(0, (diver.hp / diver.maxHp) * 100)}%`;
      this.hud.lastHp = diver.hp;
    }
    if (this.hud.lastRelics !== regionState.relics || this.hud.lastMines !== diver.charges) {
      this.hud.stats.innerText = `RELICS: ${regionState.relics}/6 | MINES: ${diver.charges}/${diver.maxCharges}`;
      this.hud.lastRelics = regionState.relics; this.hud.lastMines = diver.charges;
    }
    if (this.hud.lastDepth !== depthMeters) {
      this.hud.depth.innerText = `DEPTH: ${depthMeters}m`;
      this.hud.lastDepth = depthMeters;
    }
    if (this.hud.lastExtract !== extractMsg) {
      if(extractMsg) {
        this.hud.extractMsg.style.display = 'block';
        this.hud.extractMsg.innerText = extractMsg.text;
        this.hud.extractMsg.style.color = extractMsg.color;
      } else {
        this.hud.extractMsg.style.display = 'none';
      }
      this.hud.lastExtract = extractMsg;
    }
  }

  renderGame(engine) {
    const { diver, camera, activeRegion, mapGrid, entities, screenShake, hasDescended } = engine;
    
    this.ctx.save();
    if (screenShake > 0) this.ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);

    // 1. Draw pre-rendered environment slice
    this.ctx.drawImage(
      this.offscreenCanvas, 
      camera.x, camera.y, CONSTANTS.VIEW_W, CONSTANTS.VIEW_H,
      0, 0, CONSTANTS.VIEW_W, CONSTANTS.VIEW_H
    );

    this.ctx.save();
    this.ctx.translate(-camera.x, -camera.y);

    // 2. Draw Ship
    let shipX = (activeRegion.cols * CONSTANTS.TILE_SIZE) / 2 - 150;
    AssetManager.draw(this.ctx, 'ship', shipX + 150, 20, 378, 52, (ct) => {
      ct.fillStyle = '#455a64'; ct.beginPath(); ct.moveTo(shipX, 20); ct.lineTo(shipX + 300, 20);
      ct.lineTo(shipX + 260, 140); ct.lineTo(shipX + 40, 140); ct.fill();
      ct.fillStyle = '#ffb300'; ct.fillRect(shipX + 120, -20, 60, 40);
    });

    // 3. Draw Static Entities (Pickups, Mines)
    entities.o2Stations.forEach(st => { if (!st.consumed) AssetManager.draw(this.ctx, 'o2', st.x, st.y, 18, 36, ct => { ct.fillStyle = '#00e5ff'; ct.beginPath(); ct.arc(st.x, st.y, 8, 0, Math.PI*2); ct.fill(); }); });
    entities.ammoDrops.forEach(am => { if (!am.consumed) AssetManager.draw(this.ctx, 'ammo', am.x, am.y, 24, 24, ct => { ct.fillStyle = '#e53935'; ct.fillRect(am.x-8, am.y-8, 16, 16); }); });
    entities.relics.forEach(r => { if (!r.collected) AssetManager.draw(this.ctx, r.imageId, r.x, r.y, 20, 20, ct => { ct.fillStyle = '#ffd700'; ct.beginPath(); ct.arc(r.x, r.y, 10, 0, Math.PI*2); ct.fill(); }); });
    entities.treasures.forEach(t => { if (!t.consumed) AssetManager.draw(this.ctx, t.imageId, t.x, t.y, 24, 24, ct => { ct.fillStyle = '#ffca28'; ct.fillRect(t.x-6, t.y-6, 12, 12); }); });
    
    entities.seaMines.forEach(m => AssetManager.draw(this.ctx, 'sea_mine', m.x, m.y, 32, 32, ct => { 
      ct.fillStyle = '#ff1744'; ct.beginPath(); ct.arc(m.x, m.y, m.size, 0, Math.PI*2); ct.fill(); 
      ct.fillStyle = '#212121'; ct.fillRect(m.x-3, m.y-3, 6, 6);
    }));

    // 4. Draw Dynamic Entities (Enemies, Charges, Particles, Floaters, Projectiles)
    entities.depthCharges.forEach(dc => { 
      AssetManager.draw(this.ctx, 'charge', dc.x, dc.y, 20, 28, ct => { ct.fillStyle = '#e53935'; ct.beginPath(); ct.arc(dc.x, dc.y, 8, 0, Math.PI*2); ct.fill(); });
      if (Math.floor(dc.timer / 8) % 2 === 0) { this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; this.ctx.beginPath(); this.ctx.arc(dc.x, dc.y, 4, 0, Math.PI*2); this.ctx.fill(); }
    });

    entities.enemies.forEach(en => {
      this.ctx.save(); this.ctx.translate(en.x, en.y);
      if (en.facing === 1) this.ctx.scale(-1, 1);
      let def = ENTITY_DEFS[en.type];
      let spriteId = en.type === 'angler' ? (en.engaged ? 'angler_lit' : 'angler_unlit') : en.type;
      
      AssetManager.draw(this.ctx, spriteId, 0, 0, def.w, def.h, ct => {
        ct.fillStyle = en.type === 'shark' ? '#78909c' : '#8e24aa';
        ct.beginPath(); en.type === 'shark' ? ct.ellipse(0,0,def.w/2,def.h/2,0,0,Math.PI*2) : ct.arc(0,0,def.h/2,0,Math.PI*2); ct.fill();
      });
      this.ctx.restore();
    });

    this.ctx.strokeStyle = '#c0c0c0'; this.ctx.lineWidth = 3;
    entities.projectiles.forEach(p => { this.ctx.beginPath(); this.ctx.moveTo(p.x, p.y); this.ctx.lineTo(p.x-(p.vx*3), p.y-(p.vy*3)); this.ctx.stroke(); });
    
    entities.particles.forEach(pt => { this.ctx.fillStyle = pt.type==='blast'?'#ff9800':(pt.type==='blood'?'#d32f2f':'#8d6e63'); this.ctx.fillRect(pt.x, pt.y, 4, 4); });
    entities.floaters.forEach(fl => { this.ctx.fillStyle = fl.color; this.ctx.font = 'bold 12px sans-serif'; this.ctx.fillText(fl.text, fl.x, fl.y); });

    // 5. Draw Diver
    if (diver.invuln % 6 < 3) {
      this.ctx.save(); this.ctx.translate(diver.x, diver.y);
      let dx = InputManager.mouse.worldX - diver.x;
      let dy = InputManager.mouse.worldY - diver.y;
      if (dx < 0) this.ctx.scale(-1, 1);
      
      let prefix = 'diver';
      if (engine.activeSuit === 'suit_pink') prefix = 'diver_pink';
      if (engine.activeSuit === 'suit_green') prefix = 'diver_green';
      
      let dSprite = `${prefix}_still`;
      if (InputManager.isMoving()) dSprite = `${prefix}_swim`;
      else if (Math.abs(dx) > 30 || Math.abs(dy) > 30) dSprite = dy < 0 ? `${prefix}_aim_up` : `${prefix}_aim_fwd`;

      AssetManager.draw(this.ctx, dSprite, 0, 0, 48, 56, ct => {
        ct.fillStyle = engine.activeSuit === 'suit_pink' ? '#e91e63' : (engine.activeSuit === 'suit_green' ? '#008800' : '#ffab00');
        ct.fillRect(-12, -16, 24, 32); ct.fillStyle = '#ffd54f'; ct.beginPath(); ct.arc(0, -16, 12, 0, Math.PI*2); ct.fill(); 
      });
      this.ctx.restore();
    }

    // 6. Draw Extraction Arrow if active
    let extractMsg = null;
    if (hasDescended && diver.y < 100) {
      if (diver.x >= shipX && diver.x <= shipX + 300) {
        extractMsg = { text: "RETURN TO SHIP TO EXTRACT", color: "#38ef7d" };
      } else {
        extractMsg = { text: "SWIM TO THE SHIP HULL TO EXTRACT", color: "#ffca28" };
        let dist = (shipX + 150) - diver.x; 
        let ratio = Math.min(1, Math.abs(dist) / 1500); 
        this.ctx.fillStyle = `rgb(255, ${Math.floor(215 * (1 - ratio))}, 0)`;
        this.ctx.beginPath();
        let ax = diver.x + (dist > 0 ? 50 : -50), ay = diver.y - 40;
        if (dist > 0) {
          this.ctx.moveTo(ax-10, ay-5); this.ctx.lineTo(ax+5, ay-5); this.ctx.lineTo(ax+5, ay-10); this.ctx.lineTo(ax+15, ay); this.ctx.lineTo(ax+5, ay+10); this.ctx.lineTo(ax+5, ay+5); this.ctx.lineTo(ax-10, ay+5);
        } else {
          this.ctx.moveTo(ax+10, ay-5); this.ctx.lineTo(ax-5, ay-5); this.ctx.lineTo(ax-5, ay-10); this.ctx.lineTo(ax-15, ay); this.ctx.lineTo(ax-5, ay+10); this.ctx.lineTo(ax-5, ay+5); this.ctx.lineTo(ax+10, ay+5);
        }
        this.ctx.fill();
      }
    }
    this.ctx.restore(); 

    // 7. Optimal Pre-rendered Lighting
    let depthRatio = Math.max(0, (diver.y - 600) / (activeRegion.rows * CONSTANTS.TILE_SIZE - 600));
    let darkness = Math.min(0.96, depthRatio * activeRegion.darknessFactor);
    
    if (darkness > 0) {
      this.lightCtx.clearRect(0, 0, CONSTANTS.VIEW_W, CONSTANTS.VIEW_H);
      this.lightCtx.fillStyle = `rgba(0, 0, 7, ${darkness})`; 
      this.lightCtx.fillRect(0, 0, CONSTANTS.VIEW_W, CONSTANTS.VIEW_H);
      
      let upgrades = engine.gameState.purchasedUpgrades;
      if (upgrades.includes('flashlight') || upgrades.includes('flashlight_2')) {
        this.lightCtx.globalCompositeOperation = 'destination-out';
        let sx = diver.x - camera.x, sy = diver.y - camera.y;
        
        let hasLight2 = upgrades.includes('flashlight_2');
        let ambRad = hasLight2 ? 160 : 120;
        let bRad = hasLight2 ? 550 : 400;

        // Draw pre-rendered brushes instead of calculating gradients
        this.lightCtx.drawImage(this.ambientBrush, sx - 160, sy - 160, 320, 320);
        
        this.lightCtx.save();
        this.lightCtx.translate(sx, sy);
        this.lightCtx.rotate(diver.angle);
        this.lightCtx.drawImage(this.beamBrush, -bRad, -bRad, bRad*2, bRad*2);
        this.lightCtx.restore();
        
        entities.enemies.forEach(en => {
          if (en.type === 'angler' && en.engaged) {
            let ex = en.x - camera.x, ey = en.y - camera.y;
            this.lightCtx.drawImage(this.anglerBrush, ex - 150, ey - 150, 300, 300);
          }
        });
        this.lightCtx.globalCompositeOperation = 'source-over'; 
      }
      this.ctx.drawImage(this.lightCanvas, 0, 0);
    }
    this.ctx.restore();

    this.updateDOMHUD(diver, {relics: (engine.gameState.relicsFound[activeRegion.id]?.length || 0) + engine.relicsThisDive}, Math.floor((diver.y-120)/10), extractMsg);
  }
}

class GameEngine {
  constructor() {
    this.renderer = new Renderer(document.getElementById('gameCanvas'));
    this.gameState = SaveManager.load();
    this.preDiveState = null;
    
    // Core state
    this.activeRegion = null;
    this.mapGrid = [];
    this.camera = { x: 0, y: 0 };
    this.diver = null;
    this.isPaused = false;
    this.isRunning = false;
    this.lastTime = 0;
    this.screenShake = 0;
    this.hasDescended = false;
    this.relicsThisDive = 0;
    this.relicsThisDiveArr = [];
    this.goldThisDive = 0;
    this.activeSuit = this.gameState.activeSuit;

    // Pools & Entities
    this.spatialHash = new SpatialHash(100);
    this.pools = {
      particles: new ObjectPool(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, type: '' }), 200),
      projectiles: new ObjectPool(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0 }), 50),
      floaters: new ObjectPool(() => ({ active: false, x: 0, y: 0, text: '', color: '', life: 0 }), 30)
    };
    this.entities = { enemies: [], relics: [], treasures: [], o2Stations: [], ammoDrops: [], seaMines: [], depthCharges: [], particles: [], projectiles: [], floaters: [] };
  }

  startLevel(region) {
    const regionMusic = {
      'caribbean': 'Coconut_Coast_Jump', 'mediterranean': 'Steps_Above_The_Sea',
      'indian': 'Tides_of_the_Red_Isle', 'atlantic': 'Cannonade_at_High_Tide', 'pacific': 'Tidal_Blade_Duel'
    };
    AudioManager.playMusic(regionMusic[region.id]);

    this.preDiveState = JSON.parse(JSON.stringify(this.gameState)); // Backup
    this.activeRegion = region;
    this.activeSuit = this.gameState.activeSuit;
    this.hasDescended = false;
    this.relicsThisDive = 0;
    this.relicsThisDiveArr = [];
    this.goldThisDive = 0;
    this.screenShake = 0;
    
    this.spatialHash.clear();
    Object.values(this.pools).forEach(p => p.releaseAll());
    this.entities = { enemies: [], relics: [], treasures: [], o2Stations: [], ammoDrops: [], seaMines: [], depthCharges: [], particles: [], projectiles: [], floaters: [] };

    const upgrades = this.gameState.purchasedUpgrades;
    let maxC = 3;
    if (upgrades.includes('charge_capacity_1')) maxC += 3;
    if (upgrades.includes('charge_capacity_2')) maxC += 3;

    this.diver = {
      x: (region.cols * CONSTANTS.TILE_SIZE) / 2, y: 120, vx: 0, vy: 0, w: 24, h: 36,
      maxHp: upgrades.includes('wetsuit_armor') ? 200 : 100, hp: upgrades.includes('wetsuit_armor') ? 200 : 100,
      maxO2: upgrades.includes('tank_upgrade') ? 150 : 100, o2: upgrades.includes('tank_upgrade') ? 150 : 100,
      maxCharges: maxC, charges: maxC, angle: Math.PI / 2, invuln: 0
    };

    this.generateMap(region);
    this.renderer.preRenderEnvironment(region, this.mapGrid);
    
    document.getElementById('hubOverlay').classList.add('hidden');
    document.getElementById('dom-hud').classList.remove('hidden');
    document.getElementById('hud-depth').classList.remove('hidden');
    
    this.isRunning = true;
    this.isPaused = false;
    this.lastTime = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  }

  generateMap(region) {
    this.mapGrid = [];
    // 1. Terrain
    for (let r = 0; r < region.rows; r++) {
      this.mapGrid[r] = [];
      for (let c = 0; c < region.cols; c++) {
        if (c === 0 || c === region.cols - 1 || r === region.rows - 1) {
          this.mapGrid[r][c] = 10 + Math.floor(Math.random() * 4) + 1; 
        } else if (r < 4) {
          this.mapGrid[r][c] = 0; 
        } else {
          let scaleX = region.style === 'horizontal' ? 0.15 : 0.08;
          let scaleY = region.style === 'horizontal' ? 0.08 : 0.15;
          let n = Math.sin(c * scaleX) * Math.cos(r * scaleY) * 2.5 + Math.sin(c * 0.04) * 1.5 + Math.cos(r * 0.05) * 1.5 + Math.sin(c * 0.3 + r * 0.3) * 0.5;
          n += (Math.random() * 0.4 - 0.2);
          this.mapGrid[r][c] = n > 1.2 ? (Math.random() < 0.25 ? 20 : 10) + Math.floor(Math.random() * 4) + 1 : 0;
        }
      }
    }
    // 2. Tunnels
    let pC = Math.floor(region.cols / 2);
    for (let r = 2; r < region.rows - 2; r++) {
      pC += region.style === 'horizontal' ? (Math.random() > 0.3 ? 1 : -1) * Math.floor(Math.random() * 3) : Math.floor(Math.random() * 3) - 1;
      pC = Math.max(3, Math.min(region.cols - 4, pC));
      for (let dc = -3; dc <= 3; dc++) if (this.mapGrid[r][pC + dc]) this.mapGrid[r][pC + dc] = Math.random() < 0.15 ? 20 + Math.floor(Math.random() * 4) + 1 : 0;
    }
    
    // 3. Wrecks & Objects
    let wrecksToPlace = (region.diff === 'Medium' || region.diff === 'Hard') ? (Math.random() > 0.5 ? 2 : 1) : 0;
    let placedWrecks = 0, placedRelics = 0, placedWreckRelics = 0;
    const relicTypes = ['relic_1', 'relic_2', 'relic_3'];
    const savedRelics = this.gameState.relicsFound[region.id] || [];

    // Helper to dynamically carve a destructible path to the surface/center
    const carveToSurface = (startX, startY) => {
      let cx = startX, cy = startY;
      let targetX = Math.floor(region.cols / 2); // Ship is near center
      let styleRand = Math.random(); // 0-0.33 Vertical, 0.33-0.66 Lateral, 0.66-1.0 Balanced
      
      // Make a safe 5x5 pocket around the spawn point
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          let px = cx + dx, py = cy + dy;
          if (py >= 0 && py < region.rows && px >= 0 && px < region.cols) {
            if (this.mapGrid[py][px] >= 11 && this.mapGrid[py][px] <= 14) this.mapGrid[py][px] = 20 + Math.floor(Math.random() * 4) + 1;
          }
        }
      }

      while (cy > 4) {
        // Clear a 3x3 destructible vein to prevent diagonal pinches
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            let px = cx + dx, py = cy + dy;
            if (px >= 0 && px < region.cols && py >= 0 && py < region.rows) {
              if (this.mapGrid[py][px] >= 11 && this.mapGrid[py][px] <= 14) this.mapGrid[py][px] = 20 + Math.floor(Math.random() * 4) + 1;
            }
          }
        }
        
        // Safety check: if we've reached a high enough open water area, we can stop
        if (cy <= 10 && this.mapGrid[cy][cx] === 0) break;

        if (cx === targetX) {
          cy--; // Move straight up if already centered
        } else {
          // Determine next direction based on the randomized style
          if (styleRand < 0.33) { // Vertical bias
            if (Math.random() < 0.8) cy--; else cx += (targetX > cx ? 1 : -1);
          } else if (styleRand < 0.66) { // Lateral bias
            if (Math.random() < 0.2) cy--; else cx += (targetX > cx ? 1 : -1);
          } else { // Balanced
            if (Math.random() < 0.5) cy--; else cx += (targetX > cx ? 1 : -1);
          }
        }
      }
    };

    while(placedWrecks < wrecksToPlace) {
      let wx = Math.floor(Math.random() * (region.cols - 16)) + 2;
      let wy = region.rows - 8 - (placedWrecks * 10); 
      for(let r = 0; r < 6; r++) {
        for(let c = 0; c < 12; c++) {
          let gY = Math.min(wy + r, region.rows - 2), gX = wx + c;
          if(r === 0 || r === 5 || c === 0 || c === 11) {
            this.mapGrid[gY][gX] = ((r === 0 && (c === 5 || c === 6)) || (c === 0 && r >= 3) || (c === 11 && r >= 3)) ? 20 + Math.floor(Math.random() * 4) + 1 : 31;
          } else this.mapGrid[gY][gX] = 0;
        }
      }
      if (placedWreckRelics < 2 && placedRelics < 6) {
        this.entities.relics.push({ id: placedRelics, imageId: relicTypes[Math.floor(Math.random()*relicTypes.length)], x: (wx + 6)*CONSTANTS.TILE_SIZE + 20, y: (wy + 4)*CONSTANTS.TILE_SIZE + 20, collected: savedRelics.includes(placedRelics) });
        placedRelics++; placedWreckRelics++;
      }
      
      carveToSurface(wx + 6, wy - 1);
      
      placedWrecks++;
    }

    while (placedRelics < 6) {
      const rC = Math.floor(Math.random() * (region.cols - 10)) + 5, rR = Math.floor(Math.random() * (region.rows - 12)) + 8;
      if (this.mapGrid[rR][rC] !== 0 && this.mapGrid[rR][rC] !== 31) {
        this.mapGrid[rR][rC] = 0; 
        this.entities.relics.push({ id: placedRelics, imageId: relicTypes[Math.floor(Math.random() * 3)], x: rC * CONSTANTS.TILE_SIZE + 20, y: rR * CONSTANTS.TILE_SIZE + 20, collected: savedRelics.includes(placedRelics) });
        
        carveToSurface(rC, rR - 1);
        
        placedRelics++;
      }
    }

    // 4. Loot & Stations
    for (let i = 0; i < region.cols; i++) {
      const cC = Math.floor(Math.random() * (region.cols - 4)) + 2, cR = Math.floor(Math.random() * (region.rows - 8)) + 6;
      if (this.mapGrid[cR][cC] === 0) {
        let rand = Math.random();
        if (rand < 0.7) this.entities.treasures.push({ imageId: 'treasure', x: cC * CONSTANTS.TILE_SIZE + 20, y: cR * CONSTANTS.TILE_SIZE + 20, value: 20 + Math.floor(Math.random()*30), consumed: false });
        else if (rand < 0.85) this.entities.o2Stations.push({ x: cC * CONSTANTS.TILE_SIZE + 20, y: cR * CONSTANTS.TILE_SIZE + 20, consumed: false });
        else this.entities.ammoDrops.push({ x: cC * CONSTANTS.TILE_SIZE + 20, y: cR * CONSTANTS.TILE_SIZE + 20, consumed: false });
      }
    }

    for (let i = 0; i < region.cols * 1.5; i++) {
      const mC = Math.floor(Math.random() * (region.cols - 4)) + 2, mR = Math.floor(Math.random() * (region.rows - 10)) + 8;
      if (this.mapGrid[mR][mC] === 0 && (this.mapGrid[mR-1][mC] >= 11 || this.mapGrid[mR+1][mC] >= 11 || this.mapGrid[mR][mC-1] >= 11 || this.mapGrid[mR][mC+1] >= 11)) {
        this.entities.seaMines.push({ id: `sm_${i}`, x: mC * CONSTANTS.TILE_SIZE + 20, y: mR * CONSTANTS.TILE_SIZE + 20, size: 16 });
      }
    }

    // 5. Enemies
    let spawnPool = region.diff === 'Easy' ? ['squid', 'eel'] : (region.diff === 'Medium' ? ['squid', 'eel', 'shark', 'angler'] : ['shark', 'angler', 'ghost', 'skeleton']);
    let spawned = 0, attempts = 0;
    while(spawned < region.enemyCount && attempts < 1000) {
      const eC = Math.floor(Math.random() * (region.cols - 4)) + 2, eR = Math.floor(Math.random() * (region.rows - 8)) + 6;
      if (this.mapGrid[eR][eC] === 0) {
        let type = spawnPool[Math.floor(Math.random() * spawnPool.length)];
        let def = ENTITY_DEFS[type];
        this.entities.enemies.push({ id: `en_${spawned}`, type, x: eC * CONSTANTS.TILE_SIZE + 20, y: eR * CONSTANTS.TILE_SIZE + 20, vx: 0, vy: 0, hp: def.hp, facing: Math.random() > 0.5 ? 1 : -1, searchTimer: 0, engaged: false });
        spawned++;
      }
      attempts++;
    }
  }

  isSolid(x, y) {
    let c = Math.floor(x / CONSTANTS.TILE_SIZE), r = Math.floor(y / CONSTANTS.TILE_SIZE);
    if (c < 0 || c >= this.activeRegion.cols || r < 0 || r >= this.activeRegion.rows) return true;
    return this.mapGrid[r][c] >= 11;
  }

  spawnParticle(x, y, type, count) {
    for (let i = 0; i < count; i++) {
      let p = this.pools.particles.get();
      p.x = x; p.y = y; p.vx = (Math.random()-0.5)*5; p.vy = (Math.random()-0.5)*5; p.life = 30 + Math.random()*20; p.type = type;
    }
  }
  spawnText(x, y, text, color) {
    let f = this.pools.floaters.get();
    f.x = x; f.y = y; f.text = text; f.color = color; f.life = 60;
  }

  detonateCharge(x, y) {
    this.screenShake = 18;
    const rad = 100;
    let minC = Math.max(0, Math.floor((x - rad)/CONSTANTS.TILE_SIZE)), maxC = Math.min(this.activeRegion.cols-1, Math.floor((x + rad)/CONSTANTS.TILE_SIZE));
    let minR = Math.max(0, Math.floor((y - rad)/CONSTANTS.TILE_SIZE)), maxR = Math.min(this.activeRegion.rows-1, Math.floor((y + rad)/CONSTANTS.TILE_SIZE));
    
    // Modify mapGrid strictly within radius
    let gridChanged = false;
    for (let r = minR; r <= maxR; r++) {
      for (let c = minC; c <= maxC; c++) {
        if (Math.hypot(x - (c*CONSTANTS.TILE_SIZE+20), y - (r*CONSTANTS.TILE_SIZE+20)) < rad) {
          if (this.mapGrid[r][c] >= 21 && this.mapGrid[r][c] <= 24) { 
            this.mapGrid[r][c] = 0; this.spawnParticle(c*CONSTANTS.TILE_SIZE+20, r*CONSTANTS.TILE_SIZE+20, 'rock', 3); 
            gridChanged = true;
          }
        }
      }
    }
    // Re-render background if grid changed
    if (gridChanged) this.renderer.preRenderEnvironment(this.activeRegion, this.mapGrid);
    
    if (Math.hypot(x - this.diver.x, y - this.diver.y) < rad && this.diver.invuln <= 0) { 
      this.diver.hp -= 40; this.diver.invuln = 20; 
      AudioManager.playSFX('diver-hurt', true);
    }
    
    // Damage via Spatial Grid
    let nearby = this.spatialHash.getNearby(x, y, rad);
    nearby.forEach(ent => {
      if (Math.hypot(x - ent.x, y - ent.y) < rad) {
        if (ent.id.startsWith('en_')) {
          ent.hp -= 5;
          if (ent.hp <= 0) this.spawnParticle(ent.x, ent.y, 'blood', 15);
        } else if (ent.id.startsWith('sm_')) {
          ent.hp = 0; // Trigger mine for cascade chain-reaction
        }
      }
    });

    this.spawnParticle(x, y, 'blast', 20);
  }

  loop(timestamp) {
    if (!this.isRunning) return;
    const dtMs = timestamp - this.lastTime;
    this.lastTime = timestamp;
    
    if (!this.isPaused) {
      // Cap dt to avoid massive spikes if tab is backgrounded
      const dtRatio = Math.min(dtMs / CONSTANTS.FRAME_MS, 3.0); 
      this.update(dtRatio);
    }
    
    this.renderer.renderGame(this);
    requestAnimationFrame((t) => this.loop(t));
  }

  update(dt) {
    // Input Handling
    if (InputManager.consumeKey('Escape')) {
      AudioManager.playSFX('menu-select');
      this.isPaused = true; 
      AudioManager.setMusicVolume(0.1);
      document.getElementById('pauseOverlay').classList.remove('hidden');
    }
    if (InputManager.consumeKey(' ') && this.diver.charges > 0) {
      this.diver.charges--; 
      AudioManager.playSFX('armed-charge');
      this.entities.depthCharges.push({ x: this.diver.x, y: this.diver.y, vy: 2, timer: 120 });
    }
    if (InputManager.consumeClick() && this.diver.invuln <= 0) {
      AudioManager.playSFX('shoot');
      let angles = this.gameState.purchasedUpgrades.includes('pneumatic_spear') ? [this.diver.angle-0.15, this.diver.angle, this.diver.angle+0.15] : [this.diver.angle];
      angles.forEach(ang => {
        let p = this.pools.projectiles.get();
        p.x = this.diver.x; p.y = this.diver.y; p.vx = Math.cos(ang)*12; p.vy = Math.sin(ang)*12; p.life = 40;
      });
    }

    if (this.screenShake > 0) this.screenShake *= 0.85;
    if (this.diver.y > 300) this.hasDescended = true;

    // Extraction Check
    let shipX = (this.activeRegion.cols * CONSTANTS.TILE_SIZE) / 2 - 150;
    if (this.hasDescended && this.diver.y < 90 && this.diver.x >= shipX && this.diver.x <= shipX + 300) { 
      this.endDive(true); return; 
    }

    // Diver Physics (scaled by dt)
    const accel = 0.3 * dt, drag = Math.pow(0.92, dt), gravity = 0.12 * dt;
    if (!InputManager.isMoving()) this.diver.vy += gravity;
    if (InputManager.keys['w'] || InputManager.keys['ArrowUp']) this.diver.vy -= accel;
    if (InputManager.keys['s'] || InputManager.keys['ArrowDown']) this.diver.vy += accel;
    if (InputManager.keys['a'] || InputManager.keys['ArrowLeft']) this.diver.vx -= accel;
    if (InputManager.keys['d'] || InputManager.keys['ArrowRight']) this.diver.vx += accel;
    
    this.diver.vx *= drag; this.diver.vy *= drag;

    let moveX = this.diver.vx * dt;
    let moveY = this.diver.vy * dt;

    if (!this.isSolid(this.diver.x + moveX, this.diver.y)) this.diver.x += moveX; else this.diver.vx = 0;
    if (!this.isSolid(this.diver.x, this.diver.y + moveY)) this.diver.y += moveY; else this.diver.vy = 0;

    InputManager.mouse.worldX = InputManager.mouse.x + this.camera.x; 
    InputManager.mouse.worldY = InputManager.mouse.y + this.camera.y;
    this.diver.angle = Math.atan2(InputManager.mouse.worldY - this.diver.y, InputManager.mouse.worldX - this.diver.x);
    
    this.diver.o2 = Math.max(0, this.diver.o2 - (this.activeRegion.o2Rate * dt));
    
    if (this.diver.o2 <= 0) {
      this.diver.hp -= (0.15 * dt);
      AudioManager.chokeTimer += dt;
      if (AudioManager.chokeTimer > 60) {
        AudioManager.playSFX('diver-hurt', true);
        AudioManager.chokeTimer = 0;
      }
    } else {
      AudioManager.chokeTimer = 0;
    }
    
    if (this.diver.invuln > 0) this.diver.invuln -= dt;

    this.camera.x = Math.max(0, Math.min(this.diver.x - CONSTANTS.VIEW_W / 2, this.activeRegion.cols * CONSTANTS.TILE_SIZE - CONSTANTS.VIEW_W));
    this.camera.y = Math.max(0, Math.min(this.diver.y - CONSTANTS.VIEW_H / 2, this.activeRegion.rows * CONSTANTS.TILE_SIZE - CONSTANTS.VIEW_H));

    // Spatial Hashing Generation for this frame
    this.spatialHash.clear();
    this.entities.enemies.forEach(en => this.spatialHash.insert(en));
    this.entities.seaMines.forEach(sm => { sm.hp = 1; this.spatialHash.insert(sm); }); // Inject dummy hp

    // Interactions
    this.entities.o2Stations.forEach(st => {
      if (!st.consumed && Math.hypot(this.diver.x - st.x, this.diver.y - st.y) < 30) {
        st.consumed = true; this.diver.o2 = Math.min(this.diver.maxO2, this.diver.o2 + 50);
        AudioManager.playSFX('heal_1');
        this.spawnText(st.x, st.y, "+OXYGEN", "#00e5ff");
      }
    });

    this.entities.ammoDrops.forEach(ammo => {
      if (!ammo.consumed && Math.hypot(this.diver.x - ammo.x, this.diver.y - ammo.y) < 30 && this.diver.charges < this.diver.maxCharges) {
        ammo.consumed = true; 
        AudioManager.playSFX('chest_open');
        let gained = Math.min(2, this.diver.maxCharges - this.diver.charges);
        this.diver.charges += gained;
        this.spawnText(ammo.x, ammo.y, `+${gained} MINES`, "#e53935");
      }
    });

    this.entities.relics.forEach(r => {
      if (!r.collected && Math.hypot(this.diver.x - r.x, this.diver.y - r.y) < 30) {
        r.collected = true; this.relicsThisDive++;
        this.relicsThisDiveArr.push(r.id);
        AudioManager.playSFX('pickup-relic');
        this.spawnText(r.x, r.y, "RELIC FOUND!", "#ffd700"); 
        
        // Defensive check utilizing optional chaining and fallback
        let previouslyFound = this.gameState.relicsFound[this.activeRegion.id]?.length || 0;
        if (this.relicsThisDive + previouslyFound >= 6) {
          setTimeout(() => this.endDive(true), 1500); 
        }
      }
    });

    this.entities.treasures.forEach(t => {
      if (!t.consumed && Math.hypot(this.diver.x - t.x, this.diver.y - t.y) < 30) {
        t.consumed = true; this.goldThisDive += t.value; 
        AudioManager.playSFX('pickup-coin');
        this.spawnText(t.x, t.y, `+${t.value}g`, "#38ef7d");
      }
    });

    // Object Pooled Arrays
    this.entities.particles = this.pools.particles.getActive();
    this.entities.particles.forEach(pt => { pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt; if (pt.life <= 0) pt.active = false; });
    
    this.entities.floaters = this.pools.floaters.getActive();
    this.entities.floaters.forEach(fl => { fl.y -= 0.5*dt; fl.life -= dt; if (fl.life <= 0) fl.active = false; });
    
    this.entities.projectiles = this.pools.projectiles.getActive();
    this.entities.projectiles.forEach(p => { 
      p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; 
      if (this.isSolid(p.x, p.y) || p.life <= 0) { p.active = false; return; }
      
      let nearby = this.spatialHash.getNearby(p.x, p.y, 16);
      for(let ent of nearby) {
        let size = ent.size || ENTITY_DEFS[ent.type].size;
        if (Math.hypot(p.x - ent.x, p.y - ent.y) < size) {
          ent.hp -= 1; p.active = false;
          if (ent.hp <= 0 && ent.id.startsWith('en_')) {
            AudioManager.playSFX('sprite-hurt', true);
            this.spawnParticle(ent.x, ent.y, 'blood', 10);
          }
          break;
        }
      }
    });

    // Filter dead dynamically
    this.entities.enemies = this.entities.enemies.filter(en => en.hp > 0);

    // AI & Hazards
    this.entities.seaMines.forEach(m => {
      let detectRange = this.gameState.purchasedUpgrades.includes('upgrade_degaussed') ? (m.size + 5) : (m.size + 34);
      if (Math.hypot(this.diver.x - m.x, this.diver.y - m.y) < detectRange && this.diver.invuln <= 0) {
        m.hp = 0; // Trigger mine cascade
      }
    });

    // Cascade explosions
    this.entities.seaMines.forEach(m => {
      if (m.hp <= 0 && !m.detonated) {
        m.detonated = true;
        AudioManager.playSFX('short-explosion', true);
        this.detonateCharge(m.x, m.y); // Creates explosion and triggers nearby mines
      }
    });
    this.entities.seaMines = this.entities.seaMines.filter(sm => !sm.detonated);

    this.entities.enemies.forEach(en => {
      let def = ENTITY_DEFS[en.type];
      let dist = Math.hypot(this.diver.x - en.x, this.diver.y - en.y);
      let dx = this.diver.x - en.x, dy = this.diver.y - en.y;
      
      let inFront = (dx > 0 && en.facing === 1) || (dx < 0 && en.facing === -1);
      let effectiveAggro = inFront ? def.aggro : def.aggro * 0.35;
      
      if (dist < effectiveAggro) {
        en.engaged = true;
        let ang = Math.atan2(dy, dx);
        en.vx += Math.cos(ang) * def.speed * dt; 
        en.vy += Math.sin(ang) * def.speed * dt;
        en.facing = dx > 0 ? 1 : -1;
      } else {
        en.engaged = false; en.searchTimer += dt;
        if (en.searchTimer > def.search + Math.random() * 60) {
          en.facing *= -1; en.searchTimer = 0; en.vx = en.facing * 1.5; 
        }
      }
      
      let enDrag = Math.pow(0.95, dt);
      en.vx *= enDrag; en.vy *= enDrag;
      
      let emX = en.vx * dt, emY = en.vy * dt;
      if (!this.isSolid(en.x + emX, en.y)) en.x += emX;
      if (!this.isSolid(en.x, en.y + emY)) en.y += emY;
      
      if (dist < def.size + 12 && this.diver.invuln <= 0) {
        this.diver.hp -= 25; this.diver.invuln = 40; this.screenShake = 10; this.spawnParticle(this.diver.x, this.diver.y, 'blood', 5);
        AudioManager.playSFX('diver-hurt', true);
      }
    });

    for(let i = this.entities.depthCharges.length - 1; i >= 0; i--) {
      let dc = this.entities.depthCharges[i];
      if (!this.isSolid(dc.x, dc.y + (dc.vy * dt))) dc.y += (dc.vy * dt); 
      dc.timer -= dt;
      if (dc.timer <= 0) { 
        AudioManager.playSFX('long-explosion', true);
        this.detonateCharge(dc.x, dc.y); 
        this.entities.depthCharges.splice(i, 1); 
      }
    }

    if (this.diver.hp <= 0) { 
      this.gameState = JSON.parse(JSON.stringify(this.preDiveState));
      SaveManager.save(this.gameState);
      
      // Stop BGM immediately on death
      if (AudioManager.currentBGM) {
        AudioManager.currentBGM.pause();
        AudioManager.currentBGM.currentTime = 0;
      }
      AudioManager.playSFX('dive-failure', true);
      
      this.isRunning = false;
      UIManager.showModal("CRITICAL FAILURE", "EMERGENCY BECON ACTIVATED. You were recovered by the rescue crew, but your salvage was lost.", false)
        .then(() => window.returnToHub()); 
    }
  }

  endDive(success) {
    this.isRunning = false;
    
    // 1. Immediately silence the active level music
    if (AudioManager.currentBGM) {
      AudioManager.currentBGM.pause();
      AudioManager.currentBGM.currentTime = 0;
    }
    
    if (success) {
      AudioManager.playSFX('level_up', true);
      this.gameState.gold += this.goldThisDive;
      this.relicsThisDiveArr.forEach(id => {
        if (!this.gameState.relicsFound[this.activeRegion.id].includes(id)) {
          this.gameState.relicsFound[this.activeRegion.id].push(id);
        }
      });
      if (!this.gameState.completedRegions.includes(this.activeRegion.id)) {
        this.gameState.completedRegions.push(this.activeRegion.id);
      }
      SaveManager.save(this.gameState); 
    } else {
      AudioManager.playSFX('dive-failure', true);
      // Revert to state prior to dive to wipe un-extracted treasure
      this.gameState = JSON.parse(JSON.stringify(this.preDiveState));
      SaveManager.save(this.gameState);
    }
    
    // 2. Wait 1.5 seconds before starting the menu music so the SFX has impact
    setTimeout(() => {
      // Only play if the player hasn't somehow already started a new dive
      if (!this.isRunning) {
        AudioManager.playMusic('Tide_at_Twilight');
      }
    }, 1500);
    
    document.getElementById('pauseOverlay').classList.add('hidden');
    document.getElementById('dom-hud').classList.add('hidden');
    document.getElementById('hud-depth').classList.add('hidden');
    
    const isMaster = this.gameState.completedRegions.length === 5;
    document.getElementById('certTitle').innerText = isMaster ? " MASTER DIVER CERTIFICATE " : `DIVE LOG: ${this.activeRegion.name.toUpperCase()}`;
    document.getElementById('certStats').innerHTML = `
      <strong>Status:</strong> ${success ? "Successfully Extracted to Surface Vessel" : "<span style='color:#ff5252;'>Mission Aborted (Salvage Lost)</span>"}<br>
      <strong>Relics Secured This Dive:</strong> ${success ? this.relicsThisDive : 0}<br>
      <strong>Region Relics Total:</strong> ${this.gameState.relicsFound[this.activeRegion.id].length} / 6<br>
      <strong>Wealth Secured:</strong> ${success ? this.goldThisDive : 0} Gold<br>
      <strong>Vault Total:</strong> ${this.gameState.gold} Gold
    `;
    document.getElementById('certOverlay').classList.remove('hidden');
  }
}

let engine = null;

function totalRelicsFound() {
  return Object.values(engine.gameState.relicsFound).reduce((acc, arr) => acc + arr.length, 0);
}

function renderHub() {
  document.getElementById('goldTracker').innerText = `Vault: ${engine.gameState.gold} Gold`;
  let grp = document.getElementById('regionButtons'); grp.innerHTML = '';
  REGIONS.forEach(reg => {
    let btn = document.createElement('button');
    let rels = engine.gameState.relicsFound[reg.id]?.length || 0;
    btn.innerHTML = `${reg.name} [${reg.diff}]<br><small>${rels}/6 Relics Found</small>`;
    btn.onclick = () => {
      AudioManager.playSFX('menu-select');
      // Yield the main thread for 15ms so the browser can start the audio playback 
      // before we block the CPU with heavy map generation.
      setTimeout(() => {
        engine.startLevel(reg);
      }, 15);
    };
    grp.appendChild(btn);
  });
}

function renderShop() {
  let unspentRelics = totalRelicsFound() - (engine.gameState.spentRelics || 0);
  document.getElementById('shopGoldDisplay').innerHTML = `Vault Funds: ${engine.gameState.gold} Gold &nbsp;&nbsp;|&nbsp;&nbsp; Unspent Relics: ${unspentRelics}`;
  
  let c = document.getElementById('shopItemsContainer'); c.innerHTML = '';
  
  SHOP_ITEMS.forEach(item => {
    if (item.requires && !engine.gameState.purchasedUpgrades.includes(item.requires)) return;

    let owned = engine.gameState.purchasedUpgrades.includes(item.id);
    let canAfford = engine.gameState.gold >= item.costGold && unspentRelics >= item.costRelics;

    let btnText = owned ? 'OWNED' : 'BUY';
    if (item.type === 'suit') {
      if (engine.gameState.activeSuit === item.id) btnText = 'EQUIPPED';
      else if (owned) btnText = 'EQUIP';
    }

    let costText = '';
    if (item.costGold > 0) costText += `${item.costGold} Gold `;
    if (item.costRelics > 0) costText += `${item.costRelics} Relics`;
    if (item.costGold === 0 && item.costRelics === 0 && !owned) costText = "Free";
    if (owned && item.type !== 'suit') costText = "Acquired";

    let btnDisabled = (owned && item.type !== 'suit') || (!owned && !canAfford) || (item.type === 'suit' && engine.gameState.activeSuit === item.id);

    // Apply inline styles to mimic disabled state, rather than using the 'disabled' attribute
    let html = `
      <div class="shop-item">
        <div>
          <strong style="color: #38ef7d">${item.name}</strong><br>
          <small style="color:#90a4ae">Cost: ${costText}</small>
        </div>
        <button id="b-${item.id}" style="${btnDisabled ? 'border-color: #455a64; color: #546e7a; cursor: not-allowed; background: #07121e;' : ''}">${btnText}</button>
      </div>`;
      
    c.insertAdjacentHTML('beforeend', html);
    
    let btn = document.getElementById(`b-${item.id}`);
    if (btn) {
      btn.onclick = () => { 
        if (btnDisabled) {
          AudioManager.playSFX('menu-error');
          return;
        }
        if (owned && item.type === 'suit') {
          AudioManager.playSFX('menu-select');
          engine.gameState.activeSuit = item.id;
        } else if (!owned) {
          AudioManager.playSFX('update-success');
          engine.gameState.gold -= item.costGold; 
          engine.gameState.spentRelics += item.costRelics;
          engine.gameState.purchasedUpgrades.push(item.id); 
          if (item.type === 'suit') engine.gameState.activeSuit = item.id;
        }
        SaveManager.save(engine.gameState); 
        renderShop(); 
      };
    }
  });
}

window.returnToHub = function() {
  AudioManager.playMusic('Tide_at_Twilight');
  document.getElementById('hubOverlay').classList.remove('hidden');
  document.getElementById('certOverlay').classList.add('hidden');
  document.getElementById('pauseOverlay').classList.add('hidden');
  document.getElementById('shopOverlay').classList.add('hidden');
  document.getElementById('dom-hud').classList.add('hidden');
  document.getElementById('hud-depth').classList.add('hidden');
  renderHub();
}

async function boot() {
  InputManager.init(document.getElementById('gameCanvas'));
  await AssetManager.init();
  AudioManager.init(); // Initialize audio
  
  engine = new GameEngine();
  
  document.getElementById('openShopBtn').onclick = () => { 
    AudioManager.playSFX('menu-select');
    document.getElementById('hubOverlay').classList.add('hidden'); 
    document.getElementById('shopOverlay').classList.remove('hidden'); 
    renderShop(); 
  };
  document.getElementById('closeShopBtn').onclick = () => {
    AudioManager.playSFX('menu-select');
    window.returnToHub();
  };
  document.getElementById('resumeBtn').onclick = () => { 
    AudioManager.playSFX('menu-select');
    AudioManager.setMusicVolume(0.4); 
    engine.isPaused = false; 
    document.getElementById('pauseOverlay').classList.add('hidden'); 
  };
  document.getElementById('abortBtn').onclick = () => { 
    AudioManager.playSFX('menu-select');
    // Delay the dive termination by 150ms so the menu sound plays clearly first
    setTimeout(() => {
      engine.endDive(false); 
    }, 150);
  };
  document.getElementById('claimCertBtn').onclick = () => {
    AudioManager.playSFX('menu-select');
    window.returnToHub();
  };
  
  document.getElementById('resetDataBtn').onclick = () => {
    AudioManager.playSFX('menu-select');
    UIManager.showModal("WIPE CAREER DATA", "Are you sure you want to permanently delete all progress, upgrades, and gold? This cannot be undone.", true)
      .then(confirmed => {
        if (confirmed) {
          AudioManager.playSFX('long-explosion');
          localStorage.removeItem('abyssal_save_v18_refactored');
          localStorage.removeItem('abyssal_save_v18');
          engine.gameState = SaveManager.load();
          SaveManager.save(engine.gameState);
          renderHub();
        }
      });
  };

  renderHub();

  // Create a one-time global listener to bypass browser autoplay restrictions
  const startAudioOnInteraction = () => {
    AudioManager.playMusic('Tide_at_Twilight');
    // Remove the listeners so this only triggers once
    window.removeEventListener('click', startAudioOnInteraction);
    window.removeEventListener('keydown', startAudioOnInteraction);
  };
  
  window.addEventListener('click', startAudioOnInteraction);
  window.addEventListener('keydown', startAudioOnInteraction);
}

window.onload = boot;
</script>
</body>
</html>
