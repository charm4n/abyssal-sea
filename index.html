<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyssal Salvage - Deep Sea Diver</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030811;
      color: #e0f8ff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 600px;
      border: 4px solid #1a3b5c;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.25);
      background: #020c1b;
      cursor: crosshair;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    /* Modal / UI overlays */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 10, 25, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      padding: 30px;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 28px;
      color: #38ef7d;
      text-shadow: 0 0 10px rgba(56, 239, 125, 0.6);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    h2 {
      font-size: 18px;
      color: #00d2ff;
      margin-bottom: 20px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 800px;
      margin-top: 15px;
    }
    button {
      background: #0d223a;
      border: 2px solid #00d2ff;
      color: #e0f8ff;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover:not(:disabled) {
      background: #00d2ff;
      color: #030811;
      box-shadow: 0 0 15px #00d2ff;
    }
    button:disabled {
      border-color: #455a64;
      color: #546e7a;
      cursor: not-allowed;
    }
    .cert-card {
      border: 4px double #ffd700;
      padding: 24px;
      text-align: center;
      background: #051424;
      max-width: 550px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    }
    .cert-card h3 {
      color: #ffd700;
      font-size: 22px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .cert-stats {
      margin: 15px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #b0bec5;
      text-align: left;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }
    .shop-item {
      background: #071a2e;
      border: 1px solid #1a4971;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="960" height="600"></canvas>

  <!-- Title / Hub Overlay -->
  <div id="hubOverlay" class="ui-overlay">
    <h1>Abyssal Salvage</h1>
    <h2>Select Dive Expedition</h2>
    <div style="font-size: 14px; color: #ffd700; margin-bottom: 15px;" id="goldTracker">Salvage Vault: 0 Gold</div>
    
    <div class="btn-group" id="regionButtons">
      <!-- Generated via JS -->
    </div>

    <div class="btn-group" style="margin-top: 30px;">
      <button id="openShopBtn">Submersible Armory & Shop</button>
      <button id="resetDataBtn" style="border-color: #ff5252; color: #ff5252;">Reset Data</button>
    </div>
  </div>

  <!-- Shop Overlay -->
  <div id="shopOverlay" class="ui-overlay hidden">
    <h1>Submersible Outfitter</h1>
    <h2 id="shopGoldDisplay">Current Funds: 0 Gold</h2>
    
    <div class="shop-grid" id="shopItemsContainer">
      <!-- Generated via JS -->
    </div>

    <button id="closeShopBtn">Return to Chart Room</button>
  </div>

  <!-- Certification Modal -->
  <div id="certOverlay" class="ui-overlay hidden">
    <div class="cert-card">
      <h3 id="certTitle">Official Diver's Certification</h3>
      <p style="font-size: 12px; color: #78909c;">INTERNATIONAL MARITIME EXPLORATION BUREAU</p>
      <hr style="border: 0; height: 1px; background: #ffd700; margin: 12px 0;">
      <div class="cert-stats" id="certStats"></div>
      <button id="claimCertBtn">Log Certificate & Return to Base</button>
    </div>
  </div>
</div>

<script>
/* -------------------------------------------------------------
 *  1. SOUND SYSTEM (WEB AUDIO API)
 * ------------------------------------------------------------- */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  playShoot() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.15);
  }
  playExplode() {
    if (!this.ctx) return;
    const bufferSize = this.ctx.sampleRate * 0.5;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(300, this.ctx.currentTime);
    filter.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.5);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    noise.start();
  }
  playCoin() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
    osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
  playDamage() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.2);
  }
}
const audio = new SoundEngine();

/* -------------------------------------------------------------
 *  2. PERSISTENCE & REGION DEFINITIONS
 * ------------------------------------------------------------- */
const REGIONS = [
  { id: 'caribbean', name: 'Caribbean Sea', diff: 'Easy', o2Rate: 0.05, enemyCount: 6, depthLimit: 2000 },
  { id: 'indian', name: 'Indian Ocean', diff: 'Medium', o2Rate: 0.08, enemyCount: 9, depthLimit: 2500 },
  { id: 'mediterranean', name: 'Mediterranean Sea', diff: 'Medium', o2Rate: 0.08, enemyCount: 10, depthLimit: 2500 },
  { id: 'atlantic', name: 'Atlantic Ocean', diff: 'Hard', o2Rate: 0.12, enemyCount: 14, depthLimit: 3200 },
  { id: 'pacific', name: 'Pacific Ocean', diff: 'Hard', o2Rate: 0.14, enemyCount: 16, depthLimit: 3600 }
];

const SHOP_ITEMS = [
  { id: 'tank_upgrade', name: 'Reinforced O2 Reserve (+50% O2)', cost: 150, reqRelics: 6, unlocked: false },
  { id: 'wetsuit_armor', name: 'Reinforced Kevlar Wetsuit (Double HP)', cost: 200, reqRelics: 12, unlocked: false },
  { id: 'pneumatic_spear', name: 'Triton Multi-Harpoon (Triple Spear)', cost: 250, reqRelics: 18, unlocked: false },
  { id: 'charge_capacity', name: 'Extended Depth Mine Pouch (+3 Mines)', cost: 180, reqRelics: 6, unlocked: false }
];

let gameState = {
  gold: 0,
  relicsFound: {}, // { caribbean: [0,1,2...], ... }
  completedRegions: [],
  purchasedUpgrades: []
};

function loadSave() {
  const data = localStorage.getItem('abyssal_save');
  if (data) {
    try { gameState = JSON.parse(data); } catch(e){}
  }
  REGIONS.forEach(r => { if (!gameState.relicsFound[r.id]) gameState.relicsFound[r.id] = []; });
}

function saveState() {
  localStorage.setItem('abyssal_save', JSON.stringify(gameState));
}

function totalRelicsFound() {
  return Object.values(gameState.relicsFound).reduce((acc, arr) => acc + arr.length, 0);
}

/* -------------------------------------------------------------
 *  3. CORE SIMULATION CONSTANTS & VARIABLES
 * ------------------------------------------------------------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const TILE_SIZE = 40;
const MAP_COLS = 32; // 1280px wide
let MAP_ROWS = 60;   // Dynamic based on region depth

let activeRegion = null;
let cameraY = 0;
let keys = {};
let mouse = { x: 0, y: 0, worldX: 0, worldY: 0 };
let screenShake = 0;

let diver = null;
let projectiles = [];
let depthCharges = [];
let particles = [];
let floaters = [];
let enemies = [];
let mapGrid = [];
let relicsInLevel = [];
let treasuresInLevel = [];
let o2Stations = [];

/* -------------------------------------------------------------
 *  4. PROCEDURAL WORLD GENERATION
 * ------------------------------------------------------------- */
function initLevel(region) {
  activeRegion = region;
  MAP_ROWS = Math.floor(region.depthLimit / TILE_SIZE);
  mapGrid = [];
  projectiles = [];
  depthCharges = [];
  particles = [];
  floaters = [];
  enemies = [];
  relicsInLevel = [];
  treasuresInLevel = [];
  o2Stations = [];

  // Upgrades calculation
  const hasExtraO2 = gameState.purchasedUpgrades.includes('tank_upgrade');
  const hasExtraHP = gameState.purchasedUpgrades.includes('wetsuit_armor');
  const hasExtraCharges = gameState.purchasedUpgrades.includes('charge_capacity');

  diver = {
    x: 640,
    y: 80,
    vx: 0,
    vy: 0,
    w: 24,
    h: 36,
    maxHp: hasExtraHP ? 200 : 100,
    hp: hasExtraHP ? 200 : 100,
    maxO2: hasExtraO2 ? 150 : 100,
    o2: hasExtraO2 ? 150 : 100,
    charges: hasExtraCharges ? 6 : 3,
    maxCharges: hasExtraCharges ? 6 : 3,
    angle: 0,
    invuln: 0
  };

  // 0: Water, 1: Solid Rock, 2: Destructible Rock
  for (let r = 0; r < MAP_ROWS; r++) {
    mapGrid[r] = [];
    for (let c = 0; c < MAP_COLS; c++) {
      // Outer boundaries
      if (c === 0 || c === MAP_COLS - 1 || r === MAP_ROWS - 1) {
        mapGrid[r][c] = 1;
      } else if (r < 4) {
        mapGrid[r][c] = 0; // Top surface room
      } else {
        // Procedural cave network
        const n = Math.sin(c * 0.45) + Math.cos(r * 0.3);
        if (n > 0.8) {
          mapGrid[r][c] = Math.random() < 0.35 ? 2 : 1;
        } else {
          mapGrid[r][c] = 0;
        }
      }
    }
  }

  // Carve a vertical passage so player can always navigate down
  let pathCol = 16;
  for (let r = 2; r < MAP_ROWS - 2; r++) {
    pathCol += Math.floor(Math.random() * 3) - 1;
    pathCol = Math.max(3, Math.min(MAP_COLS - 4, pathCol));
    for (let dc = -2; dc <= 2; dc++) {
      if (mapGrid[r][pathCol + dc] === 1) {
        mapGrid[r][pathCol + dc] = Math.random() < 0.25 ? 2 : 0;
      }
    }
  }

  // Place 6 hidden Relics (either behind destructible walls or deep pockets)
  const savedRelicIds = gameState.relicsFound[region.id] || [];
  let placedRelics = 0;
  while (placedRelics < 6) {
    const rx = Math.floor(Math.random() * (MAP_COLS - 4)) + 2;
    const ry = Math.floor(Math.random() * (MAP_ROWS - 15)) + 10;
    if (mapGrid[ry][rx] === 0 || mapGrid[ry][rx] === 2) {
      // Surround with destructible rocks if in open water
      if (mapGrid[ry][rx] === 0) {
        mapGrid[ry][rx] = 2;
      }
      relicsInLevel.push({
        id: placedRelics,
        x: rx * TILE_SIZE + 20,
        y: ry * TILE_SIZE + 20,
        collected: savedRelicIds.includes(placedRelics)
      });
      placedRelics++;
    }
  }

  // Scatter treasures (gold)
  for (let i = 0; i < 25; i++) {
    const tx = Math.floor(Math.random() * (MAP_COLS - 2)) + 1;
    const ty = Math.floor(Math.random() * (MAP_ROWS - 6)) + 5;
    if (mapGrid[ty][tx] === 0) {
      treasuresInLevel.push({ x: tx * TILE_SIZE + 20, y: ty * TILE_SIZE + 20, value: 15 + Math.floor(Math.random() * 20), collected: false });
    }
  }

  // Scatter O2 refill stations
  for (let r = 12; r < MAP_ROWS - 5; r += 12) {
    for (let c = 3; c < MAP_COLS - 3; c++) {
      if (mapGrid[r][c] === 0) {
        o2Stations.push({ x: c * TILE_SIZE + 20, y: r * TILE_SIZE + 20, timer: 0 });
        break;
      }
    }
  }

  // Spawn hostile fauna
  const faunaTypes = ['shark', 'eel', 'angler', 'ghost'];
  for (let i = 0; i < region.enemyCount; i++) {
    const ex = (Math.floor(Math.random() * (MAP_COLS - 4)) + 2) * TILE_SIZE;
    const ey = (Math.floor(Math.random() * (MAP_ROWS - 12)) + 8) * TILE_SIZE;
    const type = faunaTypes[Math.floor(Math.random() * faunaTypes.length)];
    enemies.push({
      type,
      x: ex,
      y: ey,
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      hp: type === 'shark' ? 3 : (type === 'angler' ? 2 : 1),
      maxHp: 3,
      size: type === 'shark' ? 22 : 16,
      aggroRange: type === 'angler' ? 250 : 180
    });
  }
}

/* -------------------------------------------------------------
 *  5. PHYSICS & ENTITY UPDATES
 * ------------------------------------------------------------- */
function update() {
  if (!diver) return;

  // Screen shake decay
  if (screenShake > 0) screenShake *= 0.88;

  // Diver Propulsion & Drag
  const swimAccel = 0.28;
  const drag = 0.94;
  if (keys['w'] || keys['ArrowUp']) diver.vy -= swimAccel;
  if (keys['s'] || keys['ArrowDown']) diver.vy += swimAccel;
  if (keys['a'] || keys['ArrowLeft']) diver.vx -= swimAccel;
  if (keys['d'] || keys['ArrowRight']) diver.vx += swimAccel;

  diver.vx *= drag;
  diver.vy *= drag;

  // Collision with grid tiles
  const nextX = diver.x + diver.vx;
  const nextY = diver.y + diver.vy;

  if (!isSolid(nextX - diver.w / 2, diver.y) && !isSolid(nextX + diver.w / 2, diver.y)) {
    diver.x = nextX;
  } else {
    diver.vx = 0;
  }

  if (!isSolid(diver.x, nextY - diver.h / 2) && !isSolid(diver.x, nextY + diver.h / 2)) {
    diver.y = nextY;
  } else {
    diver.vy = 0;
  }

  // Aiming angle
  diver.angle = Math.atan2(mouse.worldY - diver.y, mouse.worldX - diver.x);

  // Oxygen Drain & Suffocation
  diver.o2 = Math.max(0, diver.o2 - activeRegion.o2Rate);
  if (diver.o2 <= 0) {
    diver.hp -= 0.15; // Suffocation damages health
  }

  // Invulnerability timer decay
  if (diver.invuln > 0) diver.invuln--;

  // Camera tracking
  cameraY = diver.y - canvas.height / 2;
  const maxCamY = MAP_ROWS * TILE_SIZE - canvas.height;
  cameraY = Math.max(0, Math.min(maxCamY, cameraY));
  mouse.worldX = mouse.x;
  mouse.worldY = mouse.y + cameraY;

  // Emit subtle diver bubbles
  if (Math.random() < 0.1) {
    particles.push({
      x: diver.x + (Math.random() - 0.5) * 10,
      y: diver.y,
      vx: (Math.random() - 0.5) * 0.4,
      vy: -1 - Math.random(),
      life: 50,
      type: 'bubble'
    });
  }

  // O2 Refill Stations
  o2Stations.forEach(st => {
    const dist = Math.hypot(diver.x - st.x, diver.y - st.y);
    if (dist < 40) {
      diver.o2 = Math.min(diver.maxO2, diver.o2 + 0.6);
      if (Math.random() < 0.3) {
        particles.push({ x: st.x, y: st.y, vx: (Math.random()-0.5)*1.5, vy: -2, life: 30, type: 'bubble' });
      }
    }
  });

  // Projectiles
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;

    // Tile hit
    if (isSolid(p.x, p.y) || p.life <= 0) {
      projectiles.splice(i, 1);
      continue;
    }

    // Enemy hit
    for (let e = enemies.length - 1; e >= 0; e--) {
      const en = enemies[e];
      if (Math.hypot(p.x - en.x, p.y - en.y) < en.size) {
        en.hp -= p.damage;
        audio.playDamage();
        projectiles.splice(i, 1);
        if (en.hp <= 0) {
          spawnBloodOrGlow(en.x, en.y, en.type);
          enemies.splice(e, 1);
        }
        break;
      }
    }
  }

  // Depth Charges
  for (let i = depthCharges.length - 1; i >= 0; i--) {
    const dc = depthCharges[i];
    dc.vy += 0.05; // Sink slowly
    dc.y += dc.vy;
    dc.timer--;

    if (dc.timer <= 0) {
      explodeDepthCharge(dc.x, dc.y);
      depthCharges.splice(i, 1);
    }
  }

  // Enemies
  enemies.forEach(en => {
    const distToDiver = Math.hypot(diver.x - en.x, diver.y - en.y);
    if (distToDiver < en.aggroRange) {
      const angle = Math.atan2(diver.y - en.y, diver.x - en.x);
      en.vx += Math.cos(angle) * 0.15;
      en.vy += Math.sin(angle) * 0.15;
    }
    en.vx *= 0.96;
    en.vy *= 0.96;

    if (!isSolid(en.x + en.vx, en.y)) en.x += en.vx;
    if (!isSolid(en.x, en.y + en.vy)) en.y += en.vy;

    // Damage player
    if (distToDiver < en.size + 10 && diver.invuln <= 0) {
      diver.hp -= 20;
      diver.invuln = 45;
      audio.playDamage();
      screenShake = 12;
    }
  });

  // Collect Relics
  relicsInLevel.forEach(r => {
    if (!r.collected && Math.hypot(diver.x - r.x, diver.y - r.y) < 30) {
      r.collected = true;
      if (!gameState.relicsFound[activeRegion.id].includes(r.id)) {
        gameState.relicsFound[activeRegion.id].push(r.id);
      }
      audio.playCoin();
      saveState();
      spawnPopupText(r.x, r.y, "RELIC SALVAGED!", "#ffd700");
    }
  });

  // Collect Treasures
  treasuresInLevel.forEach(t => {
    if (!t.collected && Math.hypot(diver.x - t.x, diver.y - t.y) < 26) {
      t.collected = true;
      gameState.gold += t.value;
      audio.playCoin();
      saveState();
      spawnPopupText(t.x, t.y, `+${t.value} Gold`, "#38ef7d");
    }
  });

  // Update Particles & Floating Texts
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const fl = floaters[i];
    fl.y -= 0.6;
    fl.life--;
    if (fl.life <= 0) floaters.splice(i, 1);
  }

  // Win condition: Reaching bottom research submarine or surfacing with relics
  const reachedBottom = diver.y > (MAP_ROWS - 3) * TILE_SIZE;
  if (reachedBottom && !activeRegion.clearedTriggered) {
    activeRegion.clearedTriggered = true;
    showCertification();
  }

  // Death Check
  if (diver.hp <= 0) {
    alert("DIVER LOST: Structural hull crushed or oxygen extinguished.");
    returnToHub();
  }
}

function isSolid(x, y) {
  const c = Math.floor(x / TILE_SIZE);
  const r = Math.floor(y / TILE_SIZE);
  if (c < 0 || c >= MAP_COLS || r < 0 || r >= MAP_ROWS) return true;
  return mapGrid[r][c] === 1 || mapGrid[r][c] === 2;
}

function explodeDepthCharge(x, y) {
  audio.playExplode();
  screenShake = 22;

  // Blast radius
  const radius = 100;

  // Destroy destructible tiles
  const minC = Math.max(0, Math.floor((x - radius) / TILE_SIZE));
  const maxC = Math.min(MAP_COLS - 1, Math.floor((x + radius) / TILE_SIZE));
  const minR = Math.max(0, Math.floor((y - radius) / TILE_SIZE));
  const maxR = Math.min(MAP_ROWS - 1, Math.floor((y + radius) / TILE_SIZE));

  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      if (mapGrid[r][c] === 2) {
        mapGrid[r][c] = 0; // Destroyed!
        for (let k = 0; k < 4; k++) {
          particles.push({
            x: c * TILE_SIZE + 20,
            y: r * TILE_SIZE + 20,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 40,
            type: 'debris'
          });
        }
      }
    }
  }

  // Damage enemies
  enemies.forEach(en => {
    if (Math.hypot(x - en.x, y - en.y) < radius) {
      en.hp -= 4;
    }
  });

  // Damage diver if inside blast zone!
  const distToDiver = Math.hypot(x - diver.x, y - diver.y);
  if (distToDiver < radius) {
    diver.hp -= Math.floor((1 - distToDiver / radius) * 60);
    diver.invuln = 30;
    audio.playDamage();
  }

  // Shockwave visuals
  for (let i = 0; i < 25; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 7,
      vy: (Math.random() - 0.5) * 7,
      life: 30,
      type: 'blast'
    });
  }
}

function spawnBloodOrGlow(x, y, type) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3,
      life: 40,
      type: type === 'ghost' ? 'ectoplasm' : 'blood'
    });
  }
}

function spawnPopupText(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 60 });
}

/* -------------------------------------------------------------
 *  6. PROCEDURAL RENDERING (METAL SLUG / RETRO STYLE)
 * ------------------------------------------------------------- */
function render() {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Screen shake translation
  if (screenShake > 0.5) {
    const rx = (Math.random() - 0.5) * screenShake;
    const ry = (Math.random() - 0.5) * screenShake;
    ctx.translate(rx, ry);
  }

  ctx.save();
  ctx.translate(0, -cameraY);

  // Background Water Gradient
  const grad = ctx.createLinearGradient(0, 0, 0, MAP_ROWS * TILE_SIZE);
  grad.addColorStop(0, '#004e92');
  grad.addColorStop(0.3, '#001a33');
  grad.addColorStop(1, '#00050d');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, MAP_COLS * TILE_SIZE, MAP_ROWS * TILE_SIZE);

  // Draw Grid Tiles
  for (let r = 0; r < MAP_ROWS; r++) {
    for (let c = 0; c < MAP_COLS; c++) {
      const tile = mapGrid[r][c];
      const tx = c * TILE_SIZE;
      const ty = r * TILE_SIZE;

      // Skip offscreen
      if (ty + TILE_SIZE < cameraY || ty > cameraY + canvas.height) continue;

      if (tile === 1) {
        // Indestructible Subsea Rock
        ctx.fillStyle = '#102027';
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#263238';
        ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);
      } else if (tile === 2) {
        // Destructible Cracked Coral/Fissure
        ctx.fillStyle = '#4a2c1b';
        ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = '#ff7043';
        ctx.beginPath();
        ctx.moveTo(tx + 5, ty + 5);
        ctx.lineTo(tx + 35, ty + 35);
        ctx.moveTo(tx + 30, ty + 10);
        ctx.lineTo(tx + 10, ty + 30);
        ctx.stroke();
      }
    }
  }

  // Draw O2 Stations
  o2Stations.forEach(st => {
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath();
    ctx.arc(st.x, st.y, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText("O2", st.x - 7, st.y + 4);
  });

  // Draw Sunken Relics (Gold Chalice / Relic)
  relicsInLevel.forEach(r => {
    if (!r.collected) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }
  });

  // Draw Treasures
  treasuresInLevel.forEach(t => {
    if (!t.collected) {
      ctx.fillStyle = '#ffca28';
      ctx.fillRect(t.x - 6, t.y - 6, 12, 12);
    }
  });

  // Draw Enemies
  enemies.forEach(en => {
    ctx.save();
    ctx.translate(en.x, en.y);
    if (en.type === 'shark') {
      ctx.fillStyle = '#607d8b';
      ctx.beginPath();
      ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      // Dorsal Fin
      ctx.beginPath();
      ctx.moveTo(-5, -10);
      ctx.lineTo(0, -18);
      ctx.lineTo(5, -10);
      ctx.fill();
    } else if (en.type === 'angler') {
      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      // Bioluminescent Lure
      ctx.strokeStyle = '#cddc39';
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(10, -20);
      ctx.stroke();
      ctx.fillStyle = '#eeff41';
      ctx.beginPath();
      ctx.arc(12, -22, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (en.type === 'ghost') {
      ctx.fillStyle = 'rgba(128, 222, 234, 0.7)';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Eel
      ctx.fillStyle = '#00b0ff';
      ctx.fillRect(-15, -4, 30, 8);
    }
    ctx.restore();
  });

  // Draw Depth Charges
  depthCharges.forEach(dc => {
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(dc.x, dc.y, 9, 0, Math.PI * 2);
    ctx.fill();
    // Blinking timer indicator
    if (Math.floor(dc.timer / 8) % 2 === 0) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(dc.x, dc.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Draw Projectiles
  ctx.strokeStyle = '#00e676';
  ctx.lineWidth = 3;
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5);
    ctx.stroke();
  });

  // Draw Particles
  particles.forEach(pt => {
    if (pt.type === 'bubble') {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
      ctx.stroke();
    } else if (pt.type === 'blast') {
      ctx.fillStyle = '#ff9800';
      ctx.fillRect(pt.x, pt.y, 4, 4);
    } else if (pt.type === 'debris') {
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(pt.x, pt.y, 3, 3);
    } else {
      ctx.fillStyle = '#d32f2f';
      ctx.fillRect(pt.x, pt.y, 2, 2);
    }
  });

  // Draw Diver (Pixel Art Heavy Wetsuit & Brass Helmet)
  if (diver) {
    ctx.save();
    ctx.translate(diver.x, diver.y);
    
    // Flash if invulnerable
    if (diver.invuln % 6 < 3) {
      // Diver Body
      ctx.fillStyle = '#ffab00'; // Industrial Dive Suit
      ctx.fillRect(-10, -14, 20, 28);

      // Brass Helmet & Visor
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath();
      ctx.arc(0, -14, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(-4, -16, 8, 5);

      // Aimed Harpoon Cannon
      ctx.rotate(diver.angle);
      ctx.fillStyle = '#37474f';
      ctx.fillRect(6, -3, 16, 6);
    }
    ctx.restore();
  }

  // Floating text popups
  floaters.forEach(fl => {
    ctx.fillStyle = fl.color;
    ctx.font = 'bold 12px Courier New';
    ctx.fillText(fl.text, fl.x - 20, fl.y);
  });

  // Abyss exit beacon (bottom room)
  ctx.fillStyle = '#38ef7d';
  ctx.fillRect(0, (MAP_ROWS - 1) * TILE_SIZE, MAP_COLS * TILE_SIZE, TILE_SIZE);
  ctx.fillStyle = '#030811';
  ctx.font = 'bold 16px Courier New';
  ctx.fillText("--- DEEP EXTRACTION SUBMERSIBLE TRANSHIP DOCK ---", 220, (MAP_ROWS - 0.4) * TILE_SIZE);

  ctx.restore(); // Restore camera translation

  // ---------------- HUD OVERLAY ----------------
  renderHUD();

  ctx.restore();
}

function renderHUD() {
  if (!diver) return;

  // HUD Frame
  ctx.fillStyle = 'rgba(5, 15, 30, 0.85)';
  ctx.fillRect(10, 10, 360, 80);
  ctx.strokeStyle = '#00d2ff';
  ctx.strokeRect(10, 10, 360, 80);

  // O2 Gauge
  ctx.fillStyle = '#e0f8ff';
  ctx.font = 'bold 12px Courier New';
  ctx.fillText("OXYGEN (O2)", 20, 30);
  ctx.fillStyle = '#263238';
  ctx.fillRect(110, 20, 150, 12);
  ctx.fillStyle = diver.o2 < 25 ? '#ff1744' : '#00e5ff';
  ctx.fillRect(110, 20, (diver.o2 / diver.maxO2) * 150, 12);

  // Vitality Gauge
  ctx.fillStyle = '#e0f8ff';
  ctx.fillText("HULL HP", 20, 50);
  ctx.fillStyle = '#263238';
  ctx.fillRect(110, 40, 150, 12);
  ctx.fillStyle = '#76ff03';
  ctx.fillRect(110, 40, (diver.hp / diver.maxHp) * 150, 12);

  // Depth Charges & Relics
  const currentRelics = gameState.relicsFound[activeRegion.id] ? gameState.relicsFound[activeRegion.id].length : 0;
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`RELICS: ${currentRelics}/6   CHARGES: ${diver.charges} [SPACE]`, 20, 75);

  // Current Depth Gauge
  const curDepthMeters = Math.floor(diver.y / 10);
  ctx.fillStyle = '#00e5ff';
  ctx.font = 'bold 14px Courier New';
  ctx.fillText(`DEPTH: ${curDepthMeters}m`, 820, 30);
  ctx.fillText(`GOLD: ${gameState.gold}`, 820, 50);
}

/* -------------------------------------------------------------
 *  7. CONTROLS & WEAPON ACTIONS
 * ------------------------------------------------------------- */
window.addEventListener('keydown', e => {
  keys[e.key] = true;

  // Deploy Depth Charge
  if (e.code === 'Space' && diver && diver.charges > 0) {
    diver.charges--;
    depthCharges.push({
      x: diver.x,
      y: diver.y,
      vy: 0.5,
      timer: 85 // Ticks before detonation
    });
  }
});

window.addEventListener('keyup', e => {
  keys[e.key] = false;
});

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && diver) {
    audio.init();
    audio.playShoot();

    const speed = 12;
    const hasTriple = gameState.purchasedUpgrades.includes('pneumatic_spear');
    const angles = hasTriple ? [diver.angle - 0.15, diver.angle, diver.angle + 0.15] : [diver.angle];

    angles.forEach(ang => {
      projectiles.push({
        x: diver.x,
        y: diver.y,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        damage: 1,
        life: 45
      });
    });
  }
});

/* -------------------------------------------------------------
 *  8. GAME LOOP & STATE TRANSITIONS
 * ------------------------------------------------------------- */
function gameLoop() {
  if (diver) {
    update();
    render();
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

function openRegion(regionId) {
  audio.init();
  const region = REGIONS.find(r => r.id === regionId);
  document.getElementById('hubOverlay').classList.add('hidden');
  document.getElementById('shopOverlay').classList.add('hidden');
  document.getElementById('certOverlay').classList.add('hidden');
  initLevel(region);
}

function returnToHub() {
  diver = null;
  document.getElementById('hubOverlay').classList.remove('hidden');
  document.getElementById('certOverlay').classList.add('hidden');
  document.getElementById('shopOverlay').classList.add('hidden');
  renderHub();
}

function showCertification() {
  if (!gameState.completedRegions.includes(activeRegion.id)) {
    gameState.completedRegions.push(activeRegion.id);
  }
  saveState();

  const totalRelics = totalRelicsFound();
  const isMaster = gameState.completedRegions.length === 5;

  document.getElementById('certTitle').innerText = isMaster 
    ? "★ MASTER ABYSSAL EXPLORER CERTIFICATE ★" 
    : `OFFICIAL EXPLORER CERTIFICATE: ${activeRegion.name.toUpperCase()}`;

  document.getElementById('certStats').innerHTML = `
    <strong>Site Name:</strong> ${activeRegion.name}<br>
    <strong>Maximum Depth Reached:</strong> ${activeRegion.depthLimit / 10} Meters<br>
    <strong>Regional Relics Retrieved:</strong> ${gameState.relicsFound[activeRegion.id].length} / 6<br>
    <strong>Total World Relics Recovered:</strong> ${totalRelics} / 30<br>
    <strong>Operational Status:</strong> Mission Successfully Completed<br>
    <strong>Honor Rating:</strong> ${isMaster ? "COMMANDER OF THE FIVE OCEANS" : "LICENSED DEEP SEA SALVAGER"}
  `;

  document.getElementById('certOverlay').classList.remove('hidden');
}

/* -------------------------------------------------------------
 *  9. UI & MENU LOGIC
 * ------------------------------------------------------------- */
function renderHub() {
  document.getElementById('goldTracker').innerText = `Salvage Vault: ${gameState.gold} Gold`;
  const btnGroup = document.getElementById('regionButtons');
  btnGroup.innerHTML = '';

  REGIONS.forEach(reg => {
    const btn = document.createElement('button');
    const relics = gameState.relicsFound[reg.id] ? gameState.relicsFound[reg.id].length : 0;
    const completed = gameState.completedRegions.includes(reg.id);
    btn.innerHTML = `${reg.name} [${reg.diff}]<br><small>${completed ? '✔ Cleared' : 'Incomplete'} | Relics: ${relics}/6</small>`;
    btn.onclick = () => openRegion(reg.id);
    btnGroup.appendChild(btn);
  });
}

function renderShop() {
  document.getElementById('shopGoldDisplay').innerText = `Current Funds: ${gameState.gold} Gold`;
  const container = document.getElementById('shopItemsContainer');
  container.innerHTML = '';

  const totalRelics = totalRelicsFound();

  SHOP_ITEMS.forEach(item => {
    const isOwned = gameState.purchasedUpgrades.includes(item.id);
    const meetsRelicReq = totalRelics >= item.reqRelics;

    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = `
      <div>
        <strong>${item.name}</strong><br>
        <span style="font-size: 12px; color: #90a4ae;">Cost: ${item.cost} Gold</span><br>
        <span style="font-size: 11px; color: ${meetsRelicReq ? '#00e5ff' : '#ff5252'};">
          Req: ${item.reqRelics} Total Relics (Have: ${totalRelics})
        </span>
      </div>
      <button style="margin-top: 10px;" id="buy-${item.id}" 
        ${isOwned || !meetsRelicReq || gameState.gold < item.cost ? 'disabled' : ''}>
        ${isOwned ? 'OWNED' : 'PURCHASE'}
      </button>
    `;

    container.appendChild(div);

    const btn = div.querySelector(`#buy-${item.id}`);
    if (btn && !isOwned) {
      btn.onclick = () => {
        if (gameState.gold >= item.cost && meetsRelicReq) {
          gameState.gold -= item.cost;
          gameState.purchasedUpgrades.push(item.id);
          saveState();
          audio.playCoin();
          renderShop();
        }
      };
    }
  });
}

// Hub buttons
document.getElementById('openShopBtn').onclick = () => {
  document.getElementById('hubOverlay').classList.add('hidden');
  document.getElementById('shopOverlay').classList.remove('hidden');
  renderShop();
};

document.getElementById('closeShopBtn').onclick = () => {
  document.getElementById('shopOverlay').classList.add('hidden');
  document.getElementById('hubOverlay').classList.remove('hidden');
  renderHub();
};

document.getElementById('claimCertBtn').onclick = () => {
  returnToHub();
};

document.getElementById('resetDataBtn').onclick = () => {
  if (confirm("Reset all dive progress, relics, and upgrades?")) {
    localStorage.removeItem('abyssal_save');
    loadSave();
    renderHub();
  }
};

// Initialize
loadSave();
renderHub();
</script>
</body>
